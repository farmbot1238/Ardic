<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اللغة العربية - الفصل الأول | القيم الإنسانية وحب الوطن وأمراض العصر</title>
    <style>
        /* التصميم المتكامل لمنصة اختبارات اللغة العربية - 5 وحدات */
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #2c3e2a 0%, #1a2e18 100%);
            font-family: 'Segoe UI', 'Tahoma', 'Arial', sans-serif;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            background: rgba(255, 251, 240, 0.98);
            border-radius: 65px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        /* شاشة القائمة الرئيسية */
        #menuScreen {
            padding: 40px 30px;
            text-align: center;
        }

        #menuScreen h1 {
            font-size: 2.8rem;
            background: linear-gradient(135deg, #5a7a3a, #2d5a1e);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 10px;
            font-weight: 900;
        }

        #menuScreen .sub {
            color: #4a6a3a;
            font-size: 1.2rem;
            margin-bottom: 30px;
            font-weight: 500;
        }

        #menuScreen h2 {
            color: #2d5a2d;
            font-size: 1.6rem;
            margin-bottom: 40px;
            border-bottom: 2px solid #c8a86e;
            display: inline-block;
            padding-bottom: 8px;
        }

        .main-menu {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 18px;
            margin: 40px 0 30px;
        }

        .menu-btn {
            background: linear-gradient(145deg, #e8f0e0, #d4e8c8);
            border: none;
            padding: 14px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.25s;
            color: #2a4a1e;
            box-shadow: 0 8px 12px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: inherit;
            text-align: right;
        }

        .menu-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 20px rgba(0,0,0,0.25);
            background: linear-gradient(145deg, #f8fff0, #e4f8d4);
        }

        .menu-btn.special {
            background: linear-gradient(145deg, #7a9e5a, #5a7e3a);
            color: #fff4e6;
        }

        .footer-note {
            margin-top: 35px;
            font-size: 1rem;
            color: #4a6a3a;
            background: #e0e8d4;
            display: inline-block;
            padding: 8px 22px;
            border-radius: 40px;
        }

        /* رأس الاختبار */
        .unit-header {
            background: #2d5a2d;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .back-btn {
            background: #a86e2a;
            border: none;
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }

        .back-btn:hover {
            background: #8a5620;
        }

        .unit-title {
            font-size: 1.3rem;
            font-weight: bold;
            background: #fbeac9;
            padding: 5px 20px;
            border-radius: 40px;
            color: #4a2e1a;
        }

        .unit-stats {
            background: #1a4a1a;
            color: #ffeca2;
            padding: 6px 18px;
            border-radius: 30px;
            font-weight: bold;
        }

        /* تحميل */
        .loading-overlay {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 70px;
            gap: 20px;
        }

        .spinner {
            width: 55px;
            height: 55px;
            border: 6px solid #c8d8b8;
            border-top: 6px solid #5a8e3a;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .quiz-container {
            padding: 35px 30px;
        }

        .progress-bar {
            background: #ddd2bd;
            border-radius: 30px;
            height: 14px;
            width: 100%;
            margin-bottom: 35px;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, #6a9e4a, #3a7a2a);
            width: 0%;
            height: 100%;
            border-radius: 30px;
            transition: width 0.3s;
        }

        .question-text {
            font-size: 1.5rem;
            font-weight: 600;
            color: #2a3a1e;
            background: #fefaf0;
            padding: 25px;
            border-radius: 55px;
            margin-bottom: 40px;
            line-height: 1.5;
            text-align: right;
            font-family: 'Segoe UI', 'Tahoma', sans-serif;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 18px;
            margin-bottom: 45px;
        }

        .option-btn {
            background: #f0f8ec;
            border: 2px solid #c8d8b8;
            padding: 14px 12px;
            border-radius: 55px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
            color: #2a4a1a;
            font-family: inherit;
        }

        .option-btn:hover {
            background: #e0f0d4;
            border-color: #8aba6a;
        }

        .option-btn.selected {
            background: #5a8e3a;
            border-color: #3a6e2a;
            color: white;
        }

        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .nav-btn {
            background: #6a8e5a;
            color: white;
            border: none;
            padding: 12px 35px;
            border-radius: 60px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
        }

        .nav-btn:hover {
            background: #4a6e3a;
        }

        /* منطقة النتيجة */
        .result-card {
            padding: 35px;
            text-align: center;
        }

        .result-card h1 {
            font-size: 2.4rem;
            color: #4a6e3a;
            margin-bottom: 20px;
        }

        .result-score {
            font-size: 3rem;
            font-weight: bold;
            background: #e0ecd4;
            display: inline-block;
            padding: 15px 40px;
            border-radius: 100px;
            margin: 15px auto;
        }

        .result-message {
            font-size: 1.6rem;
            font-weight: bold;
            margin: 10px;
            color: #2c6e2f;
        }

        .result-percentage {
            font-size: 1.3rem;
            background: #7aa85a;
            display: inline-block;
            padding: 5px 25px;
            border-radius: 50px;
            color: white;
            margin-bottom: 25px;
        }

        .answers-review {
            margin-top: 35px;
            text-align: right;
            background: #f0f4e8;
            padding: 20px;
            border-radius: 40px;
            max-height: 450px;
            overflow-y: auto;
        }

        .answers-review h3 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: #4a6e3a;
        }

        .review-item {
            background: white;
            margin: 12px 0;
            padding: 12px 20px;
            border-radius: 35px;
            border-right: 8px solid;
            text-align: right;
        }

        .review-correct {
            border-right-color: #2d6a4f;
            background: #eafaf1;
        }

        .review-wrong {
            border-right-color: #bc4742;
            background: #ffe6e5;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 700px) {
            .question-text { font-size: 1.1rem; }
            .menu-btn { padding: 10px 14px; font-size: 0.85rem; gap: 6px; }
            .unit-title { font-size: 0.9rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- القائمة الرئيسية -->
        <div id="menuScreen">
            <h1>📚 اللغة العربية - الفصل الأول</h1>
            <div class="sub">القيم الإنسانية | حب الوطن | أمراض العصر | الإعلام | التعليم التقني</div>
            <h2>اختر الوحدة التي تريد</h2>
            <div class="main-menu">
                <button class="menu-btn" data-unit="arabic1">📖 الوحدة الأولى: من القيم الإنسانية</button>
                <button class="menu-btn" data-unit="arabic2">🏡 الوحدة الثانية: في حب الوطن</button>
                <button class="menu-btn" data-unit="arabic3">🤝 الوحدة الثالثة: أمراض العصر</button>
                <button class="menu-btn" data-unit="arabic4">💻 الوحدة الرابعة: نحن والإعلام</button>
                <button class="menu-btn" data-unit="arabic5">🔧 الوحدة الخامسة: التعليم التقني</button>
                <button class="menu-btn special" id="comprehensiveBtn">📜 الامتحان الشامل (جميع الوحدات - 100 سؤال)</button>
            </div>
            <div class="footer-note">5 وحدات × 20 سؤالاً = 100 سؤال | الامتحان الشامل يتم اختيار 100 سؤال عشوائياً</div>
        </div>

        <!-- شاشة الاختبار -->
        <div id="quizScreen" class="hidden">
            <div class="unit-header">
                <button class="back-btn" id="backToMenuBtn">🔙 الرجوع للقائمة</button>
                <span class="unit-title" id="unitTitle">الوحدة</span>
                <span class="unit-stats" id="progressText">سؤال 1 / 20</span>
            </div>
            <div id="loadingArea" class="loading-overlay hidden">
                <div class="spinner"></div>
                <p>جاري تحميل الأسئلة...</p>
            </div>
            <div id="quizArea" class="hidden">
                <div class="quiz-container">
                    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
                    <div class="question-text" id="questionText">...</div>
                    <div class="options-grid" id="optionsContainer"></div>
                    <div class="nav-buttons">
                        <button class="nav-btn" id="prevBtn">السابق</button>
                    </div>
                </div>
            </div>
            <div id="resultArea" class="hidden">
                <div class="result-card">
                    <h1>📊 نتيجة الاختبار</h1>
                    <div class="result-score"><span id="scoreValue">0</span> / <span id="totalQuestionsValue">0</span></div>
                    <div class="result-message" id="resultMessage"></div>
                    <div class="result-percentage" id="resultPercentage"></div>
                    <button class="back-btn" id="returnToMenuBtn">🔄 اختبار جديد</button>
                    <div class="answers-review"><h3>✧ مراجعة الإجابات ✧</h3><div id="answersReview"></div></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // قاعدة الأسئلة العربية الكاملة - 5 وحدات (100 سؤال)
        const ARABIC_QUESTIONS = {
            "arabic1": [
                {"question": "ما معنى 'حق تقاته' في قوله تعالى {اتقوا الله حق تقاته}؟", "options": ["الخوف الشديد", "القدر الذي يجب أن يتقى الله به", "الالتزام بالصلاة", "الصدق باللسان"], "correct": 1},
                {"question": "الغرض من أسلوب النداء في 'يا أيها الذين آمنوا' هو:", "options": ["التعجب", "التنبيه والتشريف", "الإنكار", "التقرير"], "correct": 1},
                {"question": "الفعل المضارع المجزوم في جواب الطلب في 'استقم تنجُ' هو:", "options": ["استقم", "تنجُ", "لا يوجد فعل مجزوم", "الفعل مستتر"], "correct": 1},
                {"question": "أركان التشبيه في 'المؤمن كالنحلة' هي:", "options": ["مشبه ومشبه به فقط", "مشبه وأداة ومشبه به", "أداة ووجه شبه فقط", "أركان أربعة كاملة"], "correct": 1},
                {"question": "نوع التشبيه الذي حذفت منه الأداة ووجه الشبه يسمى:", "options": ["مرسل", "بليغ", "مفصل", "تمثيلي"], "correct": 1},
                {"question": "الفعل المضارع 'ترَ' في جملة 'اجتهد ترَ النتائج' مجزوم وعلامة جزمه:", "options": ["السكون", "حذف حرف العلة", "حذف النون", "الفتحة"], "correct": 1},
                {"question": "المقصود بـ 'شفا حفرة' في النص القرآني هو:", "options": ["قاعها", "حافتها وطرفها", "داخلها", "وسطها"], "correct": 1},
                {"question": "في قوله تعالى {فألف بين قلوبكم}، معنى 'فألف':", "options": ["ففرق", "فجمع بعد تفرق", "فأهلك", "فحاسب"], "correct": 1},
                {"question": "من قيم الوحدة الأولى التي ركزت عليها الآيات:", "options": ["الصراع", "التقوى والمساواة والعدل", "التنافس المادي", "العزلة"], "correct": 1},
                {"question": "إعراب الفعل 'تجدوا' في 'ابتعدوا عن الشبهات تجدوا الراحة' هو:", "options": ["مرفوع", "مجزوم في جواب الطلب بحذف النون", "منصوب", "مبني"], "correct": 1},
                {"question": "وجه الشبه في تشبيه 'العلم كالنور في الهداية' هو:", "options": ["العلم", "كالنور", "الهداية", "محذوف"], "correct": 2},
                {"question": "اللفظ الذي يعني 'التمسك بدين الله' هو:", "options": ["حق تقاته", "بحبل الله", "البينات", "شفا حفرة"], "correct": 1},
                {"question": "يُجزم جواب الطلب إذا كان مسبوقاً بـ:", "options": ["مبتدأ", "أمر أو نهي", "حرف جر", "اسم موصول"], "correct": 1},
                {"question": "معنى كلمة 'البينات' في سورة آل عمران:", "options": ["الأسرار", "البراهين والدلائل الواضحة", "الأساطير", "الظنون"], "correct": 1},
                {"question": "نوع التشبيه في قوله تعالى {كأنهم حمر مستنفرة}:", "options": ["بليغ", "مرسل مجمل", "مؤكد", "مفصل"], "correct": 1},
                {"question": "في 'لا تقصر تنجحْ'، الفعل 'تنجح' مجزوم لأنه:", "options": ["فعل شرط", "جواب طلب", "مسبوق بلن", "مسبوق بلم"], "correct": 1},
                {"question": "الكلمة التي تعني 'إساءة وخصام' في الآيات هي:", "options": ["عداوة", "حميم", "ولياً", "أتقاكم"], "correct": 0},
                {"question": "أداة التشبيه في جملة 'أنت كالبحر جوداً':", "options": ["أنت", "الكاف", "البحر", "جوداً"], "correct": 1},
                {"question": "معنى 'يوردانيم' عند الإغريق للأردن:", "options": ["الشدة", "المنحدر", "النهر المتعرج", "بانياس"], "correct": 1},
                {"question": "شرط جزم جواب الطلب بعد النهي أن يكون الجواب:", "options": ["محبوباً", "مكروهاً", "فعلاً ماضياً", "اسماً"], "correct": 0}
            ],
            "arabic2": [
                {"question": "من صاحب قصيدة 'عمان' التي تعبر عن الحنين؟", "options": ["محمود درويش", "عبد المنعم الرفاعي", "عبد الله رضوان", "نزار قباني"], "correct": 1},
                {"question": "معنى 'أنة' في قول الشاعر 'أنة الألم':", "options": ["صيحة", "صوت توجع وأنين", "ضحكة", "همسة"], "correct": 1},
                {"question": "يأتي الفاعل على صورة 'ضمير متصل' كما في:", "options": ["جاء المعلم", "قرأتُ القصة", "المعلم جاء", "هذا المعلم"], "correct": 1},

                {"question": "صورة الفاعل في جملة 'علمتنا هذه الحياة':", "options": ["اسم موصول", "اسم إشارة (هذه)", "ضمير", "اسم ظاهر"], "correct": 1},
                {"question": "المشبه في تشبيه تمثيلي لوصف طالب مجتهد بالنحلة هو:", "options": ["النحلة", "الطالب في حال بحثه وجده", "الأزهار", "العسل"], "correct": 1},
                {"question": "الفاعل في الفعل 'زعموا' هو:", "options": ["اسم ظاهر", "واو الجماعة", "مستتر", "الألف"], "correct": 1},
                {"question": "معنى 'نجوى' في السياق الشعري:", "options": ["صراخ", "حديث خفي وسر", "قتال", "سفر"], "correct": 1},
                {"question": "علامة رفع الفاعل في 'انطلق الرجلان' هي:", "options": ["الضمة", "الألف لأنه مثنى", "الواو", "النون"], "correct": 1},
                {"question": "من صور الفاعل أن يأتي 'اسماً موصولاً' كما في:", "options": ["جاء الذي فاز", "فاز الذي", "الفائز جاء", "أنت فزت"], "correct": 0},
                {"question": "العاطفة البارزة في قصائد 'عمانيات' هي:", "options": ["الغضب", "الحنين والارتباط بالوطن", "اليأس", "الفخر الشخصي"], "correct": 1},

            "arabic3": [
                {"question": "موضوع النص العلمي في الوحدة الثالثة هو مرض:", "options": ["السكري", "الزهايمر", "القلب", "الرشح"], "correct": 1},
                {"question": "يأتي الخبر 'جملة فعلية' كما في جملة:", "options": ["العلم نور", "العلم ينير الدروب", "العلم في الكتب", "العلم فوائده كثيرة"], "correct": 1},
                {"question": "ضرب الخبر الذي يخلو من المؤكدات يسمى:", "options": ["طلبياً", "ابتدائياً", "إنكارياً", "جمازياً"], "correct": 1},
                {"question": "المقصود بـ 'الهلوسة' في نص الزهايمر:", "options": ["النوم العميق", "تخيل أشياء لا وجود لها", "الصدق", "الذكاء"], "correct": 1},

                {"question": "الفرق بين 'سفر' و'سِفر' هو أن 'سِفر' تعني:", "options": ["رحلة", "كتاباً عظيماً", "وجهاً", "نجاحاً"], "correct": 1},

                {"question": "المعنى البلاغي للأمر في 'يا موتُ زرْ' هو:", "options": ["الإلزام", "التمني", "النصح", "التخيير"], "correct": 1},
                {"question": "المقصود بـ 'مناكبها' في 'المشي في مناكبها':", "options": ["وسطها", "أطرافها وجوانبها", "تحتها", "فوقها"], "correct": 1},
                {"question": "تسمى الواو واو المعية إذا جاءت بمعنى:", "options": ["ثم", "مع", "أو", "بل"], "correct": 1}
            ],
            "arabic5": [
                {"question": "ركز نص الوحدة الخامسة على أهمية التعليم:", "options": ["الأدبي", "التقني والمهني", "الفلسفي", "التاريخي"], "correct": 1},

                {"question": "المقصود بـ 'التلمذة المهنية' في النص:", "options": ["القراءة فقط", "التعلم القائم على ممارسة المهنة", "العزلة", "الرسم"], "correct": 1},
                {"question": "تسمى 'ما' التي تتصل بـ 'إنّ' وتكفها عن العمل:", "options": ["الموصولة", "الزائدة الكافة", "النافية", "المصدرية"], "correct": 1},
                {"question": "يفيد الاستفهام معنى 'الإنكار' في جملة:", "options": ["متى السفر؟", "أتعوق غيرك عن السير؟", "أليس الله بكاف عبده؟", "كيف حالك؟"], "correct": 1},
                {"question": "النظرة الدونية للتعليم المهني سببها في رأي الكاتب:", "options": ["قلة الرواتب", "المورثات الاجتماعية الخاطئة", "صعوبة المواد", "المناخ"], "correct": 1},
                {"question": "نوع 'ما' في قوله تعالى {ما عندكم ينفد}:", "options": ["نافية", "اسم موصول بمعنى الذي", "استفهامية", "شرطية"], "correct": 1},
                {"question": "يكون الاستفهام 'حقيقياً' إذا كان السائل:", "options": ["يعرف الإجابة", "يجهل الإجابة وينتظرها", "ينكر الفعل", "يتعجب"], "correct": 1},
                {"question": "التعليم التقني يعتبر وسيلة فعالة لمحاربة:", "options": ["الغنى", "الفقر والبطالة", "السياحة", "الفن"], "correct": 1},

                {"question": "المعنى البلاغي للاستفهام في 'هل أدلكم على تجارة تنجيكم' هو:", "options": ["التقرير", "التشويق", "النفي", "الإنكار"], "correct": 1},
                {"question": "المقصود بـ 'مستعتب' في 'ما بعد الموت من مستعتب':", "options": ["وقت للراحة", "وقت لطلب الرضا والرجوع عن الذنب", "مكان للعيش", "سفر"], "correct": 1},
                {"question": "نوع 'ما' في 'ما أجمل السماء!':", "options": ["نافية", "تعجبية", "استفهامية", "شرطية"], "correct": 1},
                {"question": "يُسأل بـ 'ما' الاستفهامية عن:", "options": ["الزمان", "صفة العاقل أو غير العاقل", "المكان", "الحال"], "correct": 1},
                {"question": "في 'ما تفعل من خير تجده'، نوع 'ما':", "options": ["نافية", "شرطية جازمة", "استفهامية", "كافة"], "correct": 1},
                {"question": "الاستفهام في 'أَلَسْتُمْ خَيْرَ مَنْ رَكِبَ الْمَطَايَا؟' يفيد:", "options": ["النفي", "التقرير", "الإنكار", "التعجب"], "correct": 1},
                {"question": "معنى 'نتوغل' في التعليم التقني:", "options": ["نبتعد", "ندخل بعمق وتوسع", "نقف", "نرفض"], "correct": 1},
                {"question": "نوع 'ما' في 'ما سأورده الآن هو نتيجة الدراسة':", "options": ["نافية", "موصولة", "استفهامية", "كافة"], "correct": 1},
                {"question": "أداة الاستفهام التي خرجت للتقرير في 'أليس الله بكاف عبده':", "options": ["ما", "الهمزة (أليس)", "هل", "من"], "correct": 1}
            ]
        };

        // منطق التطبيق
        let currentQuestions = [];
        let currentIndex = 0;
        let userAnswers = [];
        let totalQuestionsCount = 0;

        const menuScreen = document.getElementById('menuScreen');
        const quizScreen = document.getElementById('quizScreen');
        const loadingArea = document.getElementById('loadingArea');
        const quizArea = document.getElementById('quizArea');
        const resultArea = document.getElementById('resultArea');
        const unitTitleSpan = document.getElementById('unitTitle');
        const progressTextSpan = document.getElementById('progressText');
        const progressFillDiv = document.getElementById('progressFill');
        const questionTextDiv = document.getElementById('questionText');
        const optionsContainer = document.getElementById('optionsContainer');
        const prevBtn = document.getElementById('prevBtn');
        const backToMenuBtn = document.getElementById('backToMenuBtn');
        const returnToMenuBtn = document.getElementById('returnToMenuBtn');
        const comprehensiveBtn = document.getElementById('comprehensiveBtn');

        function loadQuestions(unitKey, isComprehensive = false) {
            loadingArea.classList.remove('hidden');
            quizArea.classList.add('hidden');
            resultArea.classList.add('hidden');
            setTimeout(() => {
                let selected = [];
                if (isComprehensive) {
                    let all = [];
                    for (let u in ARABIC_QUESTIONS) all.push(...ARABIC_QUESTIONS[u]);
                    for (let i = all.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [all[i], all[j]] = [all[j], all[i]];
                    }
                    selected = all.slice(0, 100);
                } else {
                    if (ARABIC_QUESTIONS[unitKey]) selected = [...ARABIC_QUESTIONS[unitKey]];
                    else selected = [];
                }
                if (!selected.length) { alert('لا توجد أسئلة'); backToMenu(); return; }
                currentQuestions = selected;
                totalQuestionsCount = currentQuestions.length;
                userAnswers = Array(totalQuestionsCount).fill(null);
                currentIndex = 0;
                renderCurrentQuestion();
                loadingArea.classList.add('hidden');
                quizArea.classList.remove('hidden');
                updateProgressBarAndText();
            }, 200);
        }

        function renderCurrentQuestion() {
            if (!currentQuestions.length) return;
            const q = currentQuestions[currentIndex];
            questionTextDiv.innerHTML = q.question;
            optionsContainer.innerHTML = '';
            const letters = ['أ', 'ب', 'ج', 'د'];
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                if (userAnswers[currentIndex] === idx) btn.classList.add('selected');
                btn.innerHTML = `${letters[idx]}. ${opt}`;
                btn.addEventListener('click', () => {
                    if (userAnswers[currentIndex] !== idx) {
                        userAnswers[currentIndex] = idx;
                        highlightSelectedOption();
                    }
                });
                optionsContainer.appendChild(btn);
            });
            prevBtn.style.display = currentIndex === 0 ? 'none' : 'inline-block';
            if (currentIndex === totalQuestionsCount - 1) {
                if (!document.getElementById('nextFinishBtn')) {
                    const finishBtn = document.createElement('button');
                    finishBtn.id = 'nextFinishBtn';
                    finishBtn.className = 'nav-btn';
                    finishBtn.textContent = 'إنهاء الاختبار 🎯';
                    finishBtn.addEventListener('click', showResults);
                    prevBtn.parentNode.appendChild(finishBtn);
                }
                const nextNormal = document.getElementById('nextNormalBtn');
                if (nextNormal) nextNormal.remove();
            } else {
                const existingFinish = document.getElementById('nextFinishBtn');
                if (existingFinish) existingFinish.remove();
                if (!document.getElementById('nextNormalBtn')) {
                    const nextBtn = document.createElement('button');
                    nextBtn.id = 'nextNormalBtn';
                    nextBtn.className = 'nav-btn';
                    nextBtn.textContent = 'التالي ➡';
                    nextBtn.addEventListener('click', () => {
                        if (currentIndex < totalQuestionsCount - 1) {
                            currentIndex++;
                            renderCurrentQuestion();
                            updateProgressBarAndText();
                        }
                    });
                    prevBtn.parentNode.appendChild(nextBtn);
                }
            }
            updateProgressBarAndText();
        }

        function highlightSelectedOption() {
            const btns = document.querySelectorAll('.option-btn');
            btns.forEach((btn, idx) => {
                if (userAnswers[currentIndex] === idx) btn.classList.add('selected');
                else btn.classList.remove('selected');
            });
        }

        function updateProgressBarAndText() {
            progressTextSpan.innerText = `سؤال ${currentIndex+1} / ${totalQuestionsCount}`;
            let percent = (currentIndex / totalQuestionsCount) * 100;
            progressFillDiv.style.width = percent + '%';
        }

        function showResults() {
            let score = 0;
            let reviewHtml = '';
            for (let i = 0; i < totalQuestionsCount; i++) {
                const userAns = userAnswers[i];
                const correctAns = currentQuestions[i].correct;
                const isCorrect = (userAns === correctAns);
                if (isCorrect) score++;
                const qText = currentQuestions[i].question;
                const userOption = userAns !== null ? currentQuestions[i].options[userAns] : 'لم يجب';
                const correctOption = currentQuestions[i].options[correctAns];
                const statusClass = isCorrect ? 'review-correct' : 'review-wrong';
                reviewHtml += `<div class="review-item ${statusClass}"><strong>❓ السؤال:</strong> ${qText}<br><span>📌 إجابتك: ${userOption}</span><br><span>✅ الإجابة الصحيحة: ${correctOption}</span></div>`;
            }
            const percentage = ((score / totalQuestionsCount) * 100).toFixed(1);
            let message = percentage >= 85 ? '🏆 ممتاز! إتقان رائع للغة العربية 🏆' : percentage >= 65 ? '📘 جيد جداً، حاول مراجعة بعض النقاط' : percentage >= 50 ? '📖 مقبول، استمر في المذاكرة' : '📚 تحتاج إلى مراجعة شاملة';
            document.getElementById('scoreValue').innerText = score;
            document.getElementById('totalQuestionsValue').innerText = totalQuestionsCount;
            document.getElementById('resultMessage').innerHTML = message;
            document.getElementById('resultPercentage').innerHTML = `النسبة المئوية: ${percentage}%`;
            document.getElementById('answersReview').innerHTML = reviewHtml;
            quizArea.classList.add('hidden');
            resultArea.classList.remove('hidden');
        }

        function backToMenu() {
            menuScreen.classList.remove('hidden');
            quizScreen.classList.add('hidden');
            currentQuestions = [];
        }

        function startQuiz(unit, isComprehensive = false) {
            menuScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
            if (isComprehensive) unitTitleSpan.innerText = '📜 الامتحان الشامل (جميع الوحدات)';
            else {
                const titles = { arabic1: '📖 الوحدة الأولى: من القيم الإنسانية', arabic2: '🏡 الوحدة الثانية: في حب الوطن', arabic3: '🤝 الوحدة الثالثة: أمراض العصر', arabic4: '💻 الوحدة الرابعة: نحن والإعلام', arabic5: '🔧 الوحدة الخامسة: التعليم التقني' };
                unitTitleSpan.innerText = titles[unit] || 'اختبار اللغة العربية';
            }
            loadQuestions(unit, isComprehensive);
        }

        document.querySelectorAll('.menu-btn:not(#comprehensiveBtn)').forEach(btn => {
            btn.addEventListener('click', () => { const unit = btn.getAttribute('data-unit'); if (unit) startQuiz(unit, false); });
        });
        comprehensiveBtn.addEventListener('click', () => startQuiz('comprehensive', true));
        backToMenuBtn.addEventListener('click', backToMenu);
        returnToMenuBtn.addEventListener('click', backToMenu);
        prevBtn.addEventListener('click', () => { if (currentIndex > 0) { currentIndex--; renderCurrentQuestion(); updateProgressBarAndText(); } });
    </script>
</body>
</html>
